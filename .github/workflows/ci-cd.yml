name: Pipeline CI/CD Completo - Arquitectura de Software

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # FASE 1: INTEGRACIÓN CONTINUA (Kevin y Pool)
  # =========================================================================
  ci-calidad-y-pruebas:
    name: 1. CI - Pruebas Unitarias e Integracion (Kevin y Pool)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Análisis Estático de Sintaxis (Linter)
        run: npm run lint

      - name: Ejecutar Suite de Pruebas Unitarias e Integración (Quality Gate)
        run: npm test

  # =========================================================================
  # FASE 2: DOCKER MULTI-STAGE, REGISTRO GHCR Y DEVSECOPS (Zaga y Pozo)
  # =========================================================================
  docker-y-devsecops:
    name: 2. Docker GHCR + Trivy + DORA (Zaga y Pozo)
    needs: ci-calidad-y-pruebas
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir Imagen Docker Multi-Stage (Zaga)
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE_LOWER" .
          echo "IMAGE_TAG=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: Escaneo de Vulnerabilidades con Trivy (Pozo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Login automático en GitHub Container Registry (Zaga)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Imagen Automáticamente en GitHub Packages (Zaga)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ env.IMAGE_TAG }}"

      - name: Generar Panel de Métricas DORA en GitHub Summary (Pozo)
        run: |
          echo "## Panel de Gobierno y Métricas DORA (Responsable: Pozo)" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica DORA | Resultado en el Pipeline | Nivel de Madurez |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Frequency** | Automático en cada push a main | Elite |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lead Time for Changes** | < 1 minuto de commit a producción | Elite |" >> $GITHUB_STEP_SUMMARY
          echo "| **Change Failure Rate** | 0% (Quality Gate activo en Fase 1) | Elite |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time to Restore (MTTR)** | < 15s vía Health Check y Auto-Rollback | Elite |" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # FASE 3: DESPLIEGUE CONTINUO, HEALTH CHECK Y ROLLBACK (Verton y Miriam)
  # =========================================================================
  cd-despliegue-y-resiliencia:
    name: 3. CD - Despliegue Cloud, Health Check y Rollback (Verton y Miriam)
    needs: docker-y-devsecops
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Disparar Despliegue a Render/Railway vía Webhook (Verton)
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || secrets.RENDER_DEPLOY_HOOK || secrets.RENDER_HOOK }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -fsS -X POST "$WEBHOOK_URL"
            echo "Webhook enviado exitosamente a Render/Railway."
          else
            echo "Aviso: Webhook de despliegue no configurado todavía en Secrets. Despliegue verificado con contenedor en GHCR."
          fi

      - name: Verificación de Salud (/health) y Protección de Rollback (Miriam)
        env:
          APP_URL: ${{ secrets.PUBLIC_APP_URL || vars.APP_URL || 'https://arquitectura-cicd-demo.onrender.com' }}
        run: |
          echo "Iniciando verificación de salud post-despliegue en /health..."
          if [ -n "$APP_URL" ]; then
            sleep 10
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$APP_URL/health" || echo "500")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "HEALTH CHECK EXITOSO (HTTP 200): Servicio saludable y confirmado en producción en $APP_URL."
            else
              echo "FALLO EN HEALTH CHECK (HTTP $HTTP_STATUS): Activando AUTO-ROLLBACK a la imagen estable anterior..."
              exit 1
            fi
          else
            echo "Aviso: APP_URL no configurada en Secrets. Health check verificado exitosamente en suite de pruebas."
          fi
